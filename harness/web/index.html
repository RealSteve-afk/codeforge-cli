<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forge Harness</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Sign-in / first-run setup -->
  <section id="auth" class="auth hidden">
    <form id="auth-form" class="card auth-card">
      <div class="brand"><span class="logo">◆</span> Forge Harness</div>
      <p id="auth-intro" class="muted"></p>
      <label>Username <input name="username" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required minlength="8"></label>
      <p id="auth-error" class="error hidden"></p>
      <button class="primary" type="submit" id="auth-submit">Sign in</button>
    </form>
  </section>

  <!-- Main app -->
  <section id="app" class="app hidden">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <div class="brand"><span class="logo">◆</span> Forge Harness</div>
        <button id="close-sidebar" class="icon-btn mobile-only" title="Close">✕</button>
      </div>
      <button id="new-session" class="primary wide">+ New session</button>
      <nav id="session-list" class="session-list" aria-label="Sessions"></nav>
      <div class="sidebar-foot">
        <div id="whoami" class="muted small"></div>
        <div class="row">
          <button id="open-settings" class="ghost">⚙ Settings</button>
          <button id="logout" class="ghost">Sign out</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="open-sidebar" class="icon-btn mobile-only" title="Sessions">☰</button>
        <div class="title-wrap">
          <input id="session-title" class="session-title" aria-label="Session title" spellcheck="false">
          <div id="session-meta" class="muted small"></div>
        </div>
        <div class="mode-toggle" role="group" aria-label="Approval mode">
          <button data-mode="ask" title="Approve every file change and command">Ask</button>
          <button data-mode="auto" title="Run tools without asking">Auto</button>
        </div>
      </header>

      <div id="messages" class="messages">
        <div id="empty" class="empty">
          <div class="logo big">◆</div>
          <h1>What should we build?</h1>
          <p class="muted">The agent can read and edit files in your workspace and run commands. In <b>Ask</b> mode you approve each change.</p>
        </div>
      </div>

      <form id="composer" class="composer">
        <textarea id="prompt" rows="1" placeholder="Message the agent…" title="Enter to send · Shift+Enter for a new line"></textarea>
        <button id="send" class="primary" type="submit">Send</button>
        <button id="stop" class="danger hidden" type="button">Stop</button>
      </form>
    </main>
  </section>

  <!-- New session dialog -->
  <dialog id="new-session-dialog" class="card dialog">
    <form id="new-session-form" method="dialog">
      <h2>New session</h2>
      <label>Profile <select name="profileId" required></select></label>
      <label>Workspace folder <input name="workspace" placeholder="/path/to/project"></label>
      <p class="muted small" id="workspace-hint"></p>
      <label>Approval mode
        <select name="mode">
          <option value="ask">Ask before changes and commands (recommended)</option>
          <option value="auto">Run everything automatically</option>
        </select>
      </label>
      <p class="error hidden" id="new-session-error"></p>
      <div class="row end">
        <button value="cancel" class="ghost" formnovalidate>Cancel</button>
        <button value="ok" class="primary">Start</button>
      </div>
    </form>
  </dialog>

  <!-- Settings dialog -->
  <dialog id="settings" class="card dialog wide-dialog">
    <div class="dialog-head">
      <h2>Settings</h2>
      <button class="icon-btn" id="close-settings" title="Close">✕</button>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="profiles" class="active">Provider profiles</button>
      <button role="tab" data-tab="account">Account</button>
      <button role="tab" data-tab="users" id="users-tab">Users</button>
    </div>

    <div class="tab" data-panel="profiles">
      <div id="profile-list" class="list"></div>
      <form id="profile-form" class="stack">
        <h3 id="profile-form-title">Add a profile</h3>
        <div class="presets" id="presets"></div>
        <input type="hidden" name="id">
        <div class="grid2">
          <label>Name <input name="name" required maxlength="40" placeholder="work-claude"></label>
          <label>Provider
            <select name="provider">
              <option value="anthropic">Anthropic (Claude)</option>
              <option value="openai">OpenAI / OpenAI-compatible</option>
            </select>
          </label>
          <label>Model <input name="model" required placeholder="claude-opus-5-5"></label>
          <label>Effort
            <select name="effort">
              <option value="">Provider default</option>
              <option>low</option><option>medium</option><option>high</option><option>xhigh</option><option>max</option>
            </select>
          </label>
          <label class="span2">Base URL <input name="baseUrl" placeholder="Leave blank for the provider's official API"></label>
          <label class="span2">API key <input name="apiKey" type="password" autocomplete="off" placeholder="Stored encrypted; leave blank to keep the current key"></label>
        </div>
        <div class="row">
          <label class="check"><input type="checkbox" name="thinking" checked> Show model thinking</label>
          <label class="check"><input type="checkbox" name="fallbacks" checked> Refusal fallback (Claude API)</label>
        </div>
        <p class="error hidden" id="profile-error"></p>
        <div class="row end">
          <button type="button" class="ghost" id="profile-reset">Clear</button>
          <button class="primary" type="submit">Save profile</button>
        </div>
      </form>
    </div>

    <div class="tab hidden" data-panel="account">
      <form id="password-form" class="stack">
        <h3>Change password</h3>
        <label>Current password <input name="currentPassword" type="password" required autocomplete="current-password"></label>
        <label>New password <input name="newPassword" type="password" required minlength="8" autocomplete="new-password"></label>
        <p class="small" id="password-msg"></p>
        <div class="row end"><button class="primary">Update password</button></div>
      </form>
    </div>

    <div class="tab hidden" data-panel="users">
      <div id="user-list" class="list"></div>
      <form id="user-form" class="stack">
        <h3>Add a user</h3>
        <div class="grid2">
          <label>Username <input name="username" required></label>
          <label>Password <input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
          <label class="span2">Workspace folders (comma separated; blank = a private folder)
            <input name="workspaceRoots" placeholder="/srv/projects/alice">
          </label>
        </div>
        <label class="check"><input type="checkbox" name="isAdmin"> Administrator</label>
        <p class="error hidden" id="user-error"></p>
        <div class="row end"><button class="primary">Create user</button></div>
      </form>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
